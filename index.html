<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXO DIGITAL</title>
  <meta name="description" content="Technology and AI Solutions Agency">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Css/Css/Css%20style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header" id="header">
    <div class="container header-inner">
      <a href="#home" class="logo" aria-label="Home">
        <img id="logoImg" class="logo-img" alt="" hidden>
        <span class="logo-text"><span id="logoMain">NEXO</span> <span id="logoAccent" class="grad-text">DIGITAL</span></span>
      </a>
      <nav class="nav" id="nav" aria-label="Main">
        <a href="#services" data-i18n="nav_services"></a>
        <a href="#process" data-i18n="nav_process"></a>
        <a href="#work" data-i18n="nav_work"></a>
        <a href="#testimonials" data-i18n="nav_testimonials"></a>
        <a href="#contact" data-i18n="nav_contact"></a>
      </nav>
      <div class="header-actions">
        <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language">EN</button>
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="badge" data-i18n="hero_badge"></p>
          <h1 data-i18n="hero_title"></h1>
          <p class="lead" data-i18n="hero_sub"></p>
          <div class="btn-row">
            <a href="#contact" class="btn btn-primary" data-i18n="hero_cta1"></a>
            <a href="#services" class="btn btn-ghost" data-i18n="hero_cta2"></a>
          </div>
        </div>
        <div class="glass chat-card" aria-hidden="true">
          <div class="chat-top"><i></i><i></i><i></i><span data-i18n="demo_label"></span></div>
          <div class="bubble user" data-i18n="demo_q"></div>
          <div class="bubble bot" data-i18n="demo_a"></div>
          <div class="typing"><b></b><b></b><b></b></div>
        </div>
      </div>
    </section>

    <section class="section" id="services">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="services_title"></h2>
          <p data-i18n="services_sub"></p>
        </div>
        <div class="grid grid-3">
          <article class="glass card"><div class="ico">&#9638;</div><h3 data-i18n="s1_t"></h3><p data-i18n="s1_d"></p></article>
          <article class="glass card"><div class="ico">&#10040;</div><h3 data-i18n="s2_t"></h3><p data-i18n="s2_d"></p></article>
          <article class="glass card"><div class="ico">&#8635;</div><h3 data-i18n="s3_t"></h3><p data-i18n="s3_d"></p></article>
          <article class="glass card"><div class="ico">&#9998;</div><h3 data-i18n="s4_t"></h3><p data-i18n="s4_d"></p></article>
          <article class="glass card"><div class="ico">&#9635;</div><h3 data-i18n="s5_t"></h3><p data-i18n="s5_d"></p></article>
          <article class="glass card"><div class="ico">&#9881;</div><h3 data-i18n="s6_t"></h3><p data-i18n="s6_d"></p></article>
        </div>
      </div>
    </section>

    <section class="section" id="process">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="process_title"></h2>
          <p data-i18n="process_sub"></p>
        </div>
        <ol class="steps">
          <li class="glass"><span class="step-n">1</span><h3 data-i18n="p1_t"></h3><p data-i18n="p1_d"></p></li>
          <li class="glass"><span class="step-n">2</span><h3 data-i18n="p2_t"></h3><p data-i18n="p2_d"></p></li>
          <li class="glass"><span class="step-n">3</span><h3 data-i18n="p3_t"></h3><p data-i18n="p3_d"></p></li>
          <li class="glass"><span class="step-n">4</span><h3 data-i18n="p4_t"></h3><p data-i18n="p4_d"></p></li>
        </ol>
      </div>
    </section>

    <section class="section" id="work">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="work_title"></h2>
          <p data-i18n="work_sub"></p>
        </div>
        <div class="grid grid-3">
          <article class="glass work"><div class="work-art a1"></div><span class="tag" data-i18n="sample_tag"></span><h3 data-i18n="w1_t"></h3><p data-i18n="w1_d"></p></article>
          <article class="glass work"><div class="work-art a2"></div><span class="tag" data-i18n="sample_tag"></span><h3 data-i18n="w2_t"></h3><p data-i18n="w2_d"></p></article>
          <article class="glass work"><div class="work-art a3"></div><span class="tag" data-i18n="sample_tag"></span><h3 data-i18n="w3_t"></h3><p data-i18n="w3_d"></p></article>
        </div>
      </div>
    </section>

    <section class="section" id="testimonials">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="testi_title"></h2>
          <p data-i18n="testi_note"></p>
        </div>
        <div class="grid grid-3">
          <figure class="glass quote"><blockquote data-i18n="t1_q"></blockquote><figcaption><span data-i18n="t1_n"></span><span class="tag" data-i18n="sample_tag"></span></figcaption></figure>
          <figure class="glass quote"><blockquote data-i18n="t2_q"></blockquote><figcaption><span data-i18n="t2_n"></span><span class="tag" data-i18n="sample_tag"></span></figcaption></figure>
          <figure class="glass quote"><blockquote data-i18n="t3_q"></blockquote><figcaption><span data-i18n="t3_n"></span><span class="tag" data-i18n="sample_tag"></span></figcaption></figure>
        </div>
      </div>
    </section>

    <section class="section" id="contact">
      <div class="container contact-grid">
        <div>
          <h2 data-i18n="contact_title"></h2>
          <p class="lead" data-i18n="contact_sub"></p>
          <ul class="contact-list">
            <li><span data-i18n="c_email"></span><a id="cEmail" href="#"></a></li>
            <li><span data-i18n="c_phone"></span><a id="cPhone" href="#" dir="ltr"></a></li>
            <li><span data-i18n="c_address"></span><b id="cAddress"></b></li>
          </ul>
          <div class="social" id="social"></div>
        </div>
        <form class="glass form" id="contactForm" novalidate>
          <label><span data-i18n="f_name"></span><input type="text" name="name" required autocomplete="name"></label>
          <label><span data-i18n="f_email"></span><input type="email" name="email" required autocomplete="email"></label>
          <label><span data-i18n="f_msg"></span><textarea name="message" rows="4" required></textarea></label>
          <button class="btn btn-primary" type="submit" data-i18n="f_send"></button>
          <p class="form-status" id="formStatus" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>&copy; <span id="year"></span> <span id="footBrand"></span>. <span data-i18n="footer_rights"></span></span>
      <a href="#home" data-i18n="footer_top"></a>
    </div>
  </footer>

  <a class="wa-float" id="waBtn" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.200 8.200 0 0 1-4.200-1.200l-.3-.2-3 .8.8-2.900-.2-.3A8.200 8.200 0 1 1 12 20.200zm4.500-6.100c-.2-.1-1.500-.7-1.700-.8s-.4-.1-.6.100-.6.800-.8 1-.3.200-.5.100a6.700 6.700 0 0 1-3.300-2.900c-.3-.4.300-.4.800-1.300.1-.2 0-.3 0-.4l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.300 3 3 0 0 0-.9 2.200 5.300 5.300 0 0 0 1.100 2.800 12 12 0 0 0 4.600 4c1.700.7 2.300.7 3.100.6a2.700 2.700 0 0 0 1.700-1.200 2.100 2.100 0 0 0 .1-1.200c-.1-.1-.2-.2-.5-.3z"/></svg>
  </a>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
